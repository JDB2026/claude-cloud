<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Latest News</title>
  <meta name="description" content="The latest Formula 1 news from multiple outlets, updated every 30 minutes.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand"><span class="flag"></span>F1 Latest News</div>
      <div class="updated" id="updated">Loading…</div>
    </div>
  </header>

  <main class="wrap">
    <section class="results" id="results" hidden aria-labelledby="race-title">
      <p class="eyebrow">Latest race result</p>
      <h2 id="race-title" class="race-title"></h2>
      <p id="race-meta" class="race-meta"></p>
      <div class="table-wrap">
        <table class="results-table">
          <thead>
            <tr><th scope="col">Pos</th><th scope="col">Driver</th><th scope="col">Team</th><th scope="col">Grid</th><th scope="col">Laps</th><th scope="col">Time / Status</th><th scope="col">Pts</th></tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search headlines or summaries…" aria-label="Search">
      <div id="sources" class="chips" role="group" aria-label="Filter by source"></div>
    </div>

    <p id="status" class="status" hidden></p>
    <ul id="list" class="news-list"></ul>
  </main>

  <footer class="wrap footer">
    <div id="source-status"></div>
    <p>Headlines and summaries come from each outlet's RSS feed. Click a card to read the original article.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
